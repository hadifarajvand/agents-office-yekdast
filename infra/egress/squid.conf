# Allow-list proxy for build-job containers. Only HTTPS CONNECT to domains in
# allowlist.txt; everything else is refused. No caching, no authentication (the network
# itself is the boundary: only job containers and the app reach this port).
http_port 3128

acl SSL_ports port 443
acl Safe_ports port 443
acl CONNECT method CONNECT
acl allowed_domains dstdomain "/etc/squid/allowlist.txt"

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow CONNECT allowed_domains
http_access allow allowed_domains
http_access deny all

cache deny all
access_log stdio:/dev/stdout
cache_log /dev/stderr
via off
forwarded_for delete
dns_v4_first on
