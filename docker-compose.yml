version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      DATABASE_URL: postgresql://ao:aopass@postgres:5432/agents_office
      REDIS_URL: redis://redis:6379
      JAEGER_AGENT_HOST: jaeger
      JAEGER_AGENT_PORT: 6831
      AO_BRAIN: ./brain
    volumes:
      - ./backend:/app/backend
      - ./brain:/app/brain
    depends_on:
      - postgres
      - redis
      - jaeger
    networks:
      - agents-office-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ao
      POSTGRES_PASSWORD: aopass
      POSTGRES_DB: agents_office
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - agents-office-net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - agents-office-net

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "6831:6831/udp"
      - "16686:16686"
    networks:
      - agents-office-net

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - agents-office-net

volumes:
  postgres_data:
  prometheus_data:

networks:
  agents-office-net:
    driver: bridge
