# Model Routing Configuration
# Maps agent tiers to model providers with fallback chains

tiers:
  reasoning_deep:
    description: Complex architecture, strategy, security analysis
    primary: claude-opus-4-20250514
    fallbacks:
      - claude-sonnet-4-20250514
    max_tokens: 8192
    temperature: 0.3

  reasoning_fast:
    description: Main development, code generation, reviews
    primary: claude-sonnet-4-20250514
    fallbacks:
      - claude-haiku-4-5-20251001
    max_tokens: 4096
    temperature: 0.2

  cheap_fast:
    description: Content generation, simple tasks, high volume
    primary: claude-haiku-4-5-20251001
    fallbacks: []
    max_tokens: 2048
    temperature: 0.4

  rag_specialist:
    description: RAG generation with citation grounding
    primary: claude-sonnet-4-20250514
    fallbacks:
      - claude-haiku-4-5-20251001
    max_tokens: 4096
    temperature: 0.1

  local_only:
    description: Budget-exceeded fallback, local models only
    primary: ollama/llama3.1
    fallbacks:
      - ollama/mistral
    max_tokens: 2048
    temperature: 0.3

cost_controls:
  daily_budget_usd: 50.0
  warn_at_pct: 80
