<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Citadel Agent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0e1220; color: #e6e9f5; padding: 16px; min-height: 100vh; }
    h1 { font-size: 16px; font-weight: 600; margin-bottom: 12px; color: #5b8dff; }
    .input-row { display: flex; gap: 8px; margin-bottom: 16px; }
    input { flex: 1; padding: 10px 12px; border: 1px solid #1f2540; border-radius: 8px; background: #151a2e; color: #e6e9f5; font-size: 14px; outline: none; }
    input:focus { border-color: #5b8dff; }
    button { padding: 10px 16px; border: none; border-radius: 8px; background: #5b8dff; color: #fff; font-weight: 600; cursor: pointer; font-size: 14px; }
    button:hover { background: #4a7de6; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .response { background: #151a2e; border: 1px solid #1f2540; border-radius: 8px; padding: 12px; margin-top: 8px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; max-height: 400px; overflow-y: auto; }
    .status { font-size: 12px; color: #8b92ab; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>Citadel Agent Assistant</h1>
  <div class="input-row">
    <input id="query" type="text" placeholder="Ask about this page..." />
    <button id="ask" type="button">Ask</button>
  </div>
  <div id="output" class="response" hidden></div>
  <div id="status" class="status"></div>

  <script>
    const queryInput = document.getElementById('query');
    const askBtn = document.getElementById('ask');
    const output = document.getElementById('output');
    const status = document.getElementById('status');

    askBtn.addEventListener('click', async () => {
      const query = queryInput.value.trim();
      if (!query) return;

      askBtn.disabled = true;
      status.textContent = 'Thinking...';
      output.hidden = true;

      const [tab] = await chrome.tabs.query({ active: true, currentWindow: true });

      const response = await chrome.runtime.sendMessage({
        type: 'BROWSE_QUERY',
        tabId: tab.id,
        query,
      });

      output.textContent = response.answer || response.error || 'No response';
      output.hidden = false;
      status.textContent = response.model_used ? `Model: ${response.model_used}` : '';
      askBtn.disabled = false;
    });

    queryInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') askBtn.click();
    });
  </script>
</body>
</html>
