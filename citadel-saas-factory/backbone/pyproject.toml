[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backbone*"]

[project]
name = "citadel-backbone"
version = "0.1.0"
description = "Runtime engine for the Citadel SaaS Factory agent fleet"
requires-python = ">=3.12"
license = {text = "MIT"}

dependencies = [
    "litellm>=1.50",
    "anthropic>=0.40",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
    "pyyaml>=6.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]
rag = [
    "tiktoken>=0.7.0",
    "pgvector>=0.3.0",
    "asyncpg>=0.30.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "S", "B", "A", "C4", "SIM"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
asyncio_mode = "auto"
